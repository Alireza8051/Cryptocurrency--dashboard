<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست پروکسی نوبیتکس</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: Tahoma; background: #121212; color: white; padding: 15px; margin: 0; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        h3 { color: #667eea; margin-top: 0; }
        .result { background: #000; padding: 10px; border-radius: 8px; font-size: 11px; direction: ltr; text-align: left; overflow-x: auto; word-break: break-all; max-height: 200px; overflow-y: auto; margin-top: 10px; }
        .ok { color: #00c853; }
        .err { color: #ff1744; }
        .warn { color: #ffc107; }
        #chart { height: 250px; background: #1e1e1e; border-radius: 12px; }
        button { background: #667eea; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-family: Tahoma; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h3>🧪 تست اتصال به نوبیتکس</h3>
        <button onclick="testProxy('BTCIRT', 1)">تست BTC (resolution=1)</button>
        <button onclick="testProxy('BTCIRT', 5)">تست BTC (resolution=5)</button>
        <button onclick="testProxy('BTCIRT', 60)">تست BTC (resolution=60)</button>
        <button onclick="testProxy('USDTIRT', 1)">تست USDT (resolution=1)</button>
    </div>

    <div class="card">
        <h3>📋 نتیجه تست:</h3>
        <div id="result" class="result">منتظر تست...</div>
    </div>

    <div class="card">
        <h3>📊 نمودار (اگر داده بیاید):</h3>
        <div id="chart"></div>
    </div>

    <script>
        let candleSeries = null;
        let chart = null;

        function initChart() {
            const chartContainer = document.getElementById('chart');
            chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: 250,
                layout: { background: { color: '#1e1e1e' }, textColor: '#fff' },
                grid: { vertLines: { color: '#2a2a2a' }, horzLines: { color: '#2a2a2a' } },
                timeScale: { timeVisible: true, secondsVisible: false }
            });
            candleSeries = chart.addCandlestickSeries({
                upColor: '#00c853', downColor: '#ff1744'
            });
        }

        async function testProxy(symbol, resolution) {
            const resultEl = document.getElementById('result');
            resultEl.innerHTML = `<span class="warn">⏳ در حال تست ${symbol} با resolution=${resolution}...</span>`;

            const nobitexUrl = `https://apiv2.nobitex.ir/market/udf/history?symbol=${symbol}&resolution=${resolution}&countback=500`;
            const proxyUrl = `https://ali-proxy-commint.alirezaalinejadmofrad.workers.dev/?url=${encodeURIComponent(nobitexUrl)}`;

            resultEl.innerHTML += `<br><br><strong>URL:</strong><br>${proxyUrl}`;

            try {
                const response = await fetch(proxyUrl);
                const text = await response.text();
                
                resultEl.innerHTML += `<br><br><strong>HTTP Status:</strong> ${response.status}`;
                resultEl.innerHTML += `<br><strong>Response (اول 500 کاراکتر):</strong><br>${text.substring(0, 500)}`;

                try {
                    const data = JSON.parse(text);
                    
                    if (data.s === 'ok' && data.t && data.t.length > 0) {
                        resultEl.innerHTML += `<br><br><span class="ok">✅ موفق! ${data.t.length} کندل دریافت شد.</span>`;
                        
                        const candles = [];
                        for (let i = 0; i < data.t.length; i++) {
                            candles.push({
                                time: data.t[i],
                                open: Number(data.o[i]) / 10,
                                high: Number(data.h[i]) / 10,
                                low: Number(data.l[i]) / 10,
                                close: Number(data.c[i]) / 10
                            });
                        }
                        if (candleSeries) candleSeries.setData(candles);
                        chart.timeScale().fitContent();
                    } else if (data.s === 'no_data') {
                        resultEl.innerHTML += `<br><br><span class="warn">⚠️ نوبیتکس گفت: no_data (داده‌ای برای این بازه ندارد)</span>`;
                    } else {
                        resultEl.innerHTML += `<br><br><span class="err">❌ پاسخ نامعتبر: ${JSON.stringify(data).substring(0, 200)}</span>`;
                    }
                } catch (parseErr) {
                    resultEl.innerHTML += `<br><br><span class="err">❌ پاسخ JSON معتبر نیست: ${parseErr.message}</span>`;
                }
            } catch (fetchErr) {
                resultEl.innerHTML += `<br><br><span class="err">❌ خطای Fetch: ${fetchErr.message}</span>`;
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initChart);
        } else {
            initChart();
        }
    </script>
</body>
</html>
